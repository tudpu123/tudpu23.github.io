<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付二维码上传</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .upload-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .upload-btn:hover {
            background-color: #40a9ff;
        }
        #fileInput {
            display: none;
        }
        .preview-section {
            display: none;
            text-align: center;
            margin-top: 30px;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 600px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .image-info {
            margin-top: 20px;
            color: #666;
        }
        .tip {
            margin-top: 10px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>支付二维码上传</h1>
        
        <div class="upload-section">
            <label for="fileInput" class="upload-btn">
                选择图片上传
            </label>
            <input type="file" id="fileInput" accept="image/*">
            <div class="tip">支持JPG、PNG、GIF等常见图片格式</div>
        </div>
        
        <div id="previewSection" class="preview-section">
            <h2>图片预览</h2>
            <img id="imagePreview" src="" alt="预览图片">
            <div class="image-info">
                <p>文件名: <span id="fileName"></span></p>
                <p>尺寸: <span id="imageSize"></span></p>
            </div>
            <button id="resetBtn" class="upload-btn" style="margin-top: 20px; background-color: #f5222d;">
                重新上传
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const previewSection = document.getElementById('previewSection');
            const imagePreview = document.getElementById('imagePreview');
            const fileName = document.getElementById('fileName');
            const imageSize = document.getElementById('imageSize');
            const resetBtn = document.getElementById('resetBtn');

            fileInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    
                    // 检查文件类型
                    if (!file.type.match('image.*')) {
                        alert('请上传图片文件！');
                        return;
                    }
                    
                    // 读取文件并显示预览
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            // 显示图片预览
                            imagePreview.src = event.target.result;
                            fileName.textContent = file.name;
                            imageSize.textContent = img.width + ' x ' + img.height;
                            previewSection.style.display = 'block';
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            resetBtn.addEventListener('click', function() {
                fileInput.value = '';
                previewSection.style.display = 'none';
                imagePreview.src = '';
            });
        });
    </script>
</body>
</html>
